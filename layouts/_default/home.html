{{ define "main" }}
  {{- with .Content }}
    <article class="main">
      {{ . }}
    </article>
  {{- else }}
    <p class="text-slate-500 leading-relaxed" style="margin-top: 0;">Writing about growth, marketing, and humanity.</p>
  {{- end }}

  {{- $posts := where site.RegularPages "Section" "posts" -}}
  {{- with $posts.Limit 3 }}
    <section>
      <h2>Recent posts</h2>
      {{ partial "posts/list.html" . }}
    </section>
  {{ end -}}
{{ end }}
