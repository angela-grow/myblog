{{ define "main" }}
  {{- with .Content }}
    <article class="main">
      {{ . }}
    </article>
  {{ end -}}

  {{- $posts := where site.RegularPages "Section" "posts" -}}
  {{- with $posts.Limit 3 }}
    <section>
      <h2>Recent posts</h2>
      {{ partial "posts/list.html" . }}
    </section>
  {{ end -}}
{{ end }}
